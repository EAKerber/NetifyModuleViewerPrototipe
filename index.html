<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carregando visualizador…</title><style>html,body{height:100%;margin:0;background:#101416;color:#e8ecee;font:16px system-ui;display:grid;place-items:center}main{text-align:center;max-width:32rem;padding:2rem}progress{width:18rem;max-width:80vw}small{display:block;margin-top:1rem;color:#9aa5aa}</style></head><body><main><p>Carregando visualizador 360°…</p><progress id="p" max="25" value="0"></progress><small id="s">Preparando dados locais</small></main><script>(async()=>{const n=25,p=document.getElementById('p'),s=document.getElementById('s'),parts=[];for(let i=0;i<n;i++){s.textContent=`Carregando ${i+1} de ${n}`;const r=await fetch(`payload/part-${String(i).padStart(2,'0')}.txt`);if(!r.ok)throw new Error(`Falha no pacote ${i}`);parts.push(await r.text());p.value=i+1}s.textContent='Inicializando interface';const bin=atob(parts.join('')),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0)),stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')),page=await new Response(stream).text();document.open();document.write(page);document.close()})().catch(e=>{document.querySelector('main').innerHTML='<h1>Falha ao carregar</h1><p>'+e.message+'</p>'})</script></body></html>
